<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Trend Signals</title>
<meta name="description" content="Trend-following crypto &amp; gold signals on Telegram">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@500;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: ink-and-gold "trading desk" — a live breakout chart as the hero, then proof (real 3-year backtest), then the product, pricing and FAQ. */
:root{
  --paper:#F5F6F2; --panel:#FFFFFF; --ink:#101B2B; --muted:#5B6675; --line:#DCE0DA;
  --gold:#A87A1F; --gold-soft:#F3E7C9; --up:#177A4E; --down:#B8392F; --band:#E7EBF1;
  --chip:#EDF0EA; --wa:#1E8E52;
  --f-display:"Alexandria","IBM Plex Sans Arabic",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Arabic","Segoe UI",system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:14px; --max:1120px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0B1320; --panel:#111C2C; --ink:#E9EDF3; --muted:#9AA6B6; --line:#233246;
  --gold:#E0B454; --gold-soft:#2A2616; --up:#3DBE83; --down:#EE6A5E; --band:#17263A; --chip:#172437; --wa:#2FB36B; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0B1320; --panel:#111C2C; --ink:#E9EDF3; --muted:#9AA6B6; --line:#233246;
  --gold:#E0B454; --gold-soft:#2A2616; --up:#3DBE83; --down:#EE6A5E; --band:#17263A; --chip:#172437; --wa:#2FB36B; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.65}
.wrap{max-width:var(--max);margin-inline:auto;padding-inline:20px}
h1,h2,h3{font-family:var(--f-display);line-height:1.2;text-wrap:balance;margin:0}
h2{font-size:clamp(1.6rem,3.2vw,2.3rem);font-weight:800}
h3{font-size:1.1rem;font-weight:700}
p{margin:0}
a{color:inherit}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.eyebrow{font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);font-weight:600}
[dir="rtl"] .eyebrow{letter-spacing:0}
section{padding-block:72px}
.lead{color:var(--muted);max-width:62ch;margin-top:12px}

/* nav */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.nav .wrap{display:flex;align-items:center;gap:12px;padding-block:12px}
.brand{display:flex;align-items:center;gap:10px;white-space:nowrap;font-family:var(--f-display);font-weight:800;font-size:1.1rem;text-decoration:none}
.logo{width:30px;height:30px;border-radius:8px;background:var(--ink);display:grid;place-items:center}
.logo svg{width:20px;height:20px}
.nav .sp{flex:1}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.lang button{border:0;background:transparent;color:var(--muted);font:600 .85rem var(--f-body);padding:6px 12px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:12px;padding:12px 18px;font-weight:600;text-decoration:none;border:1px solid transparent;cursor:pointer;font-family:var(--f-body);font-size:1rem;white-space:nowrap}
.btn-main{background:var(--gold);color:#16120A}
.btn-main:hover{filter:brightness(1.06)}
.btn-ghost{border-color:var(--line);color:var(--ink);background:var(--panel)}
.btn:focus-visible,.lang button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.nav .btn{padding:9px 14px;font-size:.92rem}
@media (max-width:640px){.nav .btn-main span.long{display:none}}

/* hero */
.hero{padding-block:56px 40px}
.hero-grid{display:grid;grid-template-columns:1.05fr 1fr;gap:40px;align-items:center}
.hero h1{font-size:clamp(2rem,4.6vw,3.4rem);font-weight:800;letter-spacing:-.01em}
.hero h1 em{font-style:normal;color:var(--gold)}
.hero .cta{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px}
.trial-note{margin-top:12px;font-size:.9rem;color:var(--muted)}
.chartcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;min-width:0}
.chartcard .top{display:flex;justify-content:space-between;align-items:center;font-size:.85rem;color:var(--muted);gap:8px;flex-wrap:wrap}
.chartcard canvas{width:100%;height:auto;aspect-ratio:16/10;display:block;max-width:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-inline-end:6px;vertical-align:-1px}
.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin-top:40px;border-block:1px solid var(--line)}
.facts div{padding:18px 12px;min-width:0}
.facts div+div{border-inline-start:1px solid var(--line)}
.facts b{display:block;font-family:var(--f-num);font-size:1.6rem;font-weight:600}
.facts span{color:var(--muted);font-size:.88rem}
@media (max-width:860px){.hero-grid{grid-template-columns:1fr}.facts{grid-template-columns:repeat(2,1fr)}.facts div:nth-child(3){border-inline-start:0}.facts div:nth-child(n+3){border-top:1px solid var(--line)}}

/* signal demo */
.demo-grid{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center}
.tg{background:var(--band);border-radius:18px;padding:18px;max-width:440px;justify-self:center;width:100%}
.msg{background:var(--panel);border-radius:14px;padding:14px 16px;font-size:.93rem;line-height:1.7;box-shadow:0 1px 0 var(--line)}
.msg .h{font-weight:700}
.msg .row{display:flex;gap:8px}
.msg .up{color:var(--up);font-weight:600}.msg .dn{color:var(--down);font-weight:600}
.msg code{font-family:var(--f-num);background:var(--chip);padding:1px 6px;border-radius:6px}
.tgbtn{margin-top:8px;background:var(--panel);border-radius:10px;text-align:center;padding:9px;font-size:.9rem;color:var(--gold);font-weight:600;border:1px solid var(--line)}
.checks{display:grid;gap:14px;margin-top:22px;padding:0;list-style:none}
.checks li{display:flex;gap:12px;align-items:flex-start}
.checks svg{flex:none;margin-top:4px}
@media (max-width:860px){.demo-grid{grid-template-columns:1fr}}

/* features */
.feat{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:34px}
.feat article{padding:22px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);display:flex;flex-direction:column;gap:8px;min-width:0}
.feat .ic{width:40px;height:40px;border-radius:10px;background:var(--gold-soft);display:grid;place-items:center;color:var(--gold)}
.feat p{color:var(--muted);font-size:.95rem}
@media (max-width:860px){.feat{grid-template-columns:1fr 1fr}}
@media (max-width:560px){.feat{grid-template-columns:1fr}}

/* proof */
.proof{background:var(--panel);border-block:1px solid var(--line)}
.proof-grid{display:grid;grid-template-columns:1.5fr 1fr;gap:32px;margin-top:30px;align-items:start}
.eqwrap{min-width:0}
#eq{width:100%;height:auto;display:block}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.kpis div{padding:16px;min-width:0;border-bottom:1px solid var(--line)}
.kpis div:nth-child(odd){border-inline-end:1px solid var(--line)}
.kpis div:nth-last-child(-n+2){border-bottom:0}
.kpis b{display:block;font-family:var(--f-num);font-size:1.45rem;font-weight:600}
.kpis small{display:block;color:var(--muted);font-size:.82rem;line-height:1.4}
.kpis .vs{font-size:.78rem;color:var(--muted);font-family:var(--f-num)}
.years{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:18px}
.years div{border:1px solid var(--line);border-radius:12px;padding:12px;min-width:0}
@media (max-width:1000px){.years{grid-template-columns:repeat(2,1fr)}}
.years b{font-family:var(--f-num);font-size:1.2rem;color:var(--up)}
.years span{display:block;color:var(--muted);font-size:.8rem}
.note{margin-top:18px;font-size:.85rem;color:var(--muted);border-inline-start:3px solid var(--gold);padding-inline-start:12px}
@media (max-width:860px){.proof-grid{grid-template-columns:1fr}}

/* steps */
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:30px;counter-reset:s}
.steps div{padding-top:18px;border-top:2px solid var(--ink);min-width:0}
.steps div::before{counter-increment:s;content:counter(s);font-family:var(--f-num);color:var(--gold);font-weight:600;display:block;margin-bottom:6px}
.steps p{color:var(--muted);font-size:.95rem;margin-top:6px}
@media (max-width:760px){.steps{grid-template-columns:1fr}}

/* pricing */
.plans{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:30px;align-items:stretch}
.plan{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);padding:24px;display:flex;flex-direction:column;gap:10px;min-width:0}
.plan.best{border:2px solid var(--gold)}
.plan .tag{align-self:flex-start;background:var(--gold-soft);color:var(--gold);font-size:.78rem;font-weight:600;border-radius:999px;padding:3px 10px}
.plan .price{font-family:var(--f-num);font-size:2.3rem;font-weight:600}
.plan .per{color:var(--muted);font-size:.9rem}
.plan ul{padding:0;margin:6px 0 0;list-style:none;display:grid;gap:6px;color:var(--muted);font-size:.93rem}
.plan .btn{justify-content:center;margin-top:auto}
.pay{margin-top:16px;color:var(--muted);font-size:.9rem}
@media (max-width:860px){.plans{grid-template-columns:1fr}}

/* faq */
.faq{margin-top:26px;display:grid;gap:10px;max-width:820px}
.faq details{border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:14px 18px}
.faq summary{cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:10px}
.faq summary::after{content:"+";color:var(--gold);font-family:var(--f-num)}
.faq details[open] summary::after{content:"–"}
.faq p{color:var(--muted);margin-top:10px}

/* final cta + footer */
.final{background:var(--ink);color:var(--paper);border-radius:22px;padding:40px 28px;display:flex;justify-content:space-between;align-items:center;gap:22px;flex-wrap:wrap}
.final p{color:color-mix(in srgb,var(--paper) 75%,transparent);margin-top:8px;max-width:52ch}
footer{padding-block:36px 110px;color:var(--muted);font-size:.85rem}
footer .wrap{display:grid;gap:10px}
.wa-line{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.copy{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:3px 10px;font:500 .8rem var(--f-body);cursor:pointer}

/* whatsapp float */
.wa{position:fixed;inset-inline-end:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:30;display:flex;align-items:center;gap:10px;background:var(--wa);color:#fff;text-decoration:none;border-radius:999px;padding:10px 16px 10px 12px;box-shadow:0 8px 24px rgba(0,0,0,.18);font-weight:600}
.wa svg{width:26px;height:26px}
.wa small{display:block;font-weight:500;opacity:.9;font-size:.72rem;line-height:1.1}
.wa .t{line-height:1.2}
@media (max-width:520px){.wa .t{display:none}.wa{padding:12px}}
@media (prefers-reduced-motion:no-preference){.rise{animation:rise .6s ease both}@keyframes rise{from{transform:translateY(8px)}to{transform:none}}}
</style>
</head>
<body>

let lang='ar';
try{const s=localStorage.getItem('lang');if(s==='ar'||s==='en')lang=s;else if(!/^ar/i.test(navigator.language||''))lang='en';}catch(e){if(!/^ar/i.test(navigator.language||''))lang='en';}
function css(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim()}
function apply(l){
  lang=l;const d=T[l];
  document.documentElement.lang=l;document.documentElement.dir=l==='ar'?'rtl':'ltr';
  document.querySelectorAll('[data-t]').forEach(el=>{const k=el.dataset.t;if(d[k]!==undefined)el.innerHTML=d[k]});
  document.getElementById('faq').innerHTML=d.faq.map((q,i)=>`<details${i===0?' open':''}><summary>${q[0]}</summary><p>${q[1]}</p></details>`).join('');
  document.getElementById('l-ar').setAttribute('aria-pressed',l==='ar');document.getElementById('l-en').setAttribute('aria-pressed',l==='en');
  try{localStorage.setItem('lang',l)}catch(e){}
  drawHero();drawEq();
}
document.querySelectorAll('.lang button').forEach(b=>b.addEventListener('click',()=>apply(b.dataset.l)));

  const n='+201025224167';

/* hero: a price path that ranges inside a 55-candle channel, then breaks out; entry, trailing stop and target drawn to scale */
function drawHero(){
  const c=document.getElementById('hero'),x=c.getContext('2d'),W=c.width,H=c.height;
  x.clearRect(0,0,W,H);
  let seed=7;const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647};
  const N=90,p=[];let v=100;
  for(let i=0;i<N;i++){
    if(i<58){v+= (rnd()-.5)*3.2; v+= (100-v)*0.08;}
    else{v+= (rnd()-.3)*3.4+0.9;}
    const o=v,cl=v+(rnd()-.45)*2.4,h=Math.max(o,cl)+rnd()*1.6,l=Math.min(o,cl)-rnd()*1.6;p.push({o,cl,h,l});v=cl;
  }
  const lo=Math.min(...p.map(k=>k.l))-4,hi=Math.max(...p.map(k=>k.h))+10;
  const pad={l:12,r:64,t:14,b:14},cw=(W-pad.l-pad.r)/N;
  const Y=q=>pad.t+(hi-q)/(hi-lo)*(H-pad.t-pad.b), X=i=>pad.l+i*cw+cw/2;
  const chHi=Math.max(...p.slice(10,58).map(k=>k.cl)),chLo=Math.min(...p.slice(10,58).map(k=>k.cl));
  x.fillStyle=css('--band');x.fillRect(X(10)-cw/2,Y(chHi),(58-10)*cw,Y(chLo)-Y(chHi));
  x.strokeStyle=css('--line');x.lineWidth=1;x.setLineDash([5,5]);
  [chHi,chLo].forEach(q=>{x.beginPath();x.moveTo(X(10)-cw/2,Y(q));x.lineTo(X(58),Y(q));x.stroke()});x.setLineDash([]);
  const up=css('--up'),dn=css('--down');
  p.forEach((k,i)=>{const col=k.cl>=k.o?up:dn;x.strokeStyle=col;x.fillStyle=col;x.lineWidth=1.2;
    x.beginPath();x.moveTo(X(i),Y(k.h));x.lineTo(X(i),Y(k.l));x.stroke();
    const y1=Y(Math.max(k.o,k.cl)),y2=Y(Math.min(k.o,k.cl));x.fillRect(X(i)-cw*0.32,y1,cw*0.64,Math.max(1.5,y2-y1));});
  let e=58;for(let i=58;i<N;i++){if(p[i].cl>chHi){e=i;break}}
  const entry=p[e].cl,stop=Math.min(...p.slice(e-20,e).map(k=>k.cl)),tp=entry+3*(entry-stop);
  const line=(q,col,dash,lab)=>{x.strokeStyle=col;x.lineWidth=2;x.setLineDash(dash);x.beginPath();x.moveTo(X(e),Y(q));x.lineTo(W-pad.r+4,Y(q));x.stroke();x.setLineDash([]);
    x.fillStyle=col;x.font='600 20px "IBM Plex Mono",monospace';x.textAlign='left';x.textBaseline='middle';x.fillText(lab,W-pad.r+8,Y(q));};
  line(tp,css('--gold'),[8,6],'TP1');line(stop,dn,[4,4],'SL');line(entry,up,[],'IN');
  x.fillStyle=up;x.beginPath();x.arc(X(e),Y(entry),7,0,Math.PI*2);x.fill();
}

/* equity: weekly $1,000 portfolio, system vs buy-and-hold basket, one shared y scale */
function drawEq(){
  const s=document.getElementById('eq'),W=720,H=380,pl=54,pr=14,pt=14,pb=34;
  const a=SERIES.s,n=a.length;
  const lo=Math.floor(Math.min(...a)/250)*250,hi=Math.ceil(Math.max(...a)/250)*250;
  const X=i=>pl+i/(n-1)*(W-pl-pr),Y=v=>pt+(hi-v)/(hi-lo)*(H-pt-pb);
  const mu=css('--muted'),ln=css('--line'),gd=css('--gold');
  let g='';
  for(let v=lo;v<=hi;v+=250){g+=`<line x1="${pl}" x2="${W-pr}" y1="${Y(v)}" y2="${Y(v)}" stroke="${ln}" stroke-width="1"/><text x="${pl-8}" y="${Y(v)}" fill="${mu}" font-size="14" font-family="IBM Plex Mono,monospace" text-anchor="end" dominant-baseline="middle">$${v.toLocaleString('en-US')}</text>`}
  let lastY='';SERIES.d.forEach((d,i)=>{const y=d.slice(0,4);if(y!==lastY&&d.slice(5,7)==='01'||i===0){if(y!==lastY){g+=`<text x="${X(i)}" y="${H-10}" fill="${mu}" font-size="14" font-family="IBM Plex Mono,monospace" text-anchor="middle">${i===0?d.slice(0,7):y}</text>`;lastY=y}}});
  const path=arr=>arr.map((v,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)).join(' ');
  const area=path(a)+` L${X(n-1)} ${Y(lo)} L${X(0)} ${Y(lo)} Z`;
  g+=`<path d="${area}" fill="${gd}" fill-opacity=".12"/>`;
  g+=`<path d="${path(a)}" fill="none" stroke="${gd}" stroke-width="2.6"/>`;
  g+=`<circle cx="${X(n-1)}" cy="${Y(a[n-1])}" r="5" fill="${gd}"/>`;
  g+=`<text x="${X(n-1)-8}" y="${Y(a[n-1])-12}" fill="${gd}" font-size="13" font-weight="600" font-family="IBM Plex Mono,monospace" text-anchor="end">$${Math.round(a[n-1]).toLocaleString('en-US')}</text>`;
  s.setAttribute('direction','ltr');s.innerHTML=g;
}
apply(lang);
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{drawHero();drawEq()});
new MutationObserver(()=>{drawHero();drawEq()}).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
</script>
